name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Initialize Submodules Explicitly
      run: |
        git submodule update --init --recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Full Debug APK
      run: ./gradlew :app_pojavlauncher:assembleFullDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lapis-Launcher-APK
        path: app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk
        
